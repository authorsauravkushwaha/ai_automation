[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hinata-local-assistant"
version = "0.1.0"
description = "HINATA: a private, offline-first desktop assistant for Windows 11"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HINATA contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Desktop Environment",
]

[project.optional-dependencies]
# 6.12.0 aborts with a shiboken refcount error (none_dealloc) while QPainter
# paints the animated desktop backdrop; 6.11.x and earlier are stable.
gui = ["PySide6-Essentials>=6.7,<6.12"]
speech = [
  "numpy>=1.26,<3",
  "sounddevice>=0.4.7,<1",
  "faster-whisper>=1.1,<2",
]
light-speech = [
  "numpy>=1.26,<3",
  "sounddevice>=0.4.7,<1",
  "vosk>=0.3.45,<0.4",
]
tts = ["pyttsx3>=2.90,<3"]
# PDF extraction runs in a bounded subprocess; DOCX requires no extra dependency.
documents = ["pypdf==7.1.0"]
windows-audio = ["pycaw>=20240210"]
speaker = ["numpy>=1.26,<2", "resemblyzer>=0.1.3,<0.2"]
wake = ["openwakeword>=0.6,<0.7", "onnxruntime>=1.17,<2"]
encrypted-db = ["sqlcipher3-binary>=0.5.2,<1"]
vector-ann = ["numpy>=1.26,<3", "hnswlib>=0.8.0,<1"]
# Optional, explicitly consented local diffusion backend; core stays stdlib-only.
image = [
  "torch>=2.3,<3",
  "diffusers>=0.30,<1",
  "transformers>=4.44,<5",
  "accelerate>=0.31,<2",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.23,<1",
  "Pillow>=10,<13",
]
web-automation = ["playwright>=1.49", "selenium>=4.15"]
dev = ["ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
hinata = "hinata.main:main"

[project.urls]
Repository = "https://github.com/authorsauravkushwaha/ai_automation"

[tool.setuptools.packages.find]
include = ["hinata*"]

[tool.setuptools.package-data]
"hinata.interface" = ["assets/*.png"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
