# HINATA local configuration. setup.ps1 copies this file to config.toml.
# Optional: override the private data directory. Defaults to %LOCALAPPDATA%\HINATA.
# data_dir = 'C:\Users\YOUR_NAME\AppData\Local\HINATA'

[ollama]
enabled = true
host = "http://127.0.0.1:11434"  # Loopback only; remote AI hosts are rejected.
# Leave empty ("") to use whichever local model is already installed.
model = "qwen2.5:0.5b-instruct-q4_K_M"  # 494M parameters, Q4_K_M, about 398 MB download.
# Install explicitly while online: ollama pull nomic-embed-text
embedding_model = "nomic-embed-text"  # Local semantic search; never downloaded automatically.
# Optional role-specific local model overrides (Lenovo LOQ i5 multi-AI arsenal; leave empty to share `model`):
# Windows setup offers this pack with a [y/N] prompt; activation happens only after successful downloads.
planner_model = ""         # e.g. "deepseek-r1:7b" or "deepseek-r1:1.5b" (reasoning & automation plans)
coding_model = ""          # e.g. "qwen2.5-coder:7b" or "deepseek-coder:6.7b" (autonomous coding & projects)
reviewer_model = ""        # e.g. "llama3.2:3b" (independent QA & safety review)
vision_model = ""          # e.g. "qwen2.5vl:7b" or "qwen2.5vl:3b" (vision & image prompt direction)
image_backend_url = "http://127.0.0.1:7860"  # Optional local A1111/Forge-compatible loopback diffusion server.
allow_model_fallback = true  # Set strict_model_pin = true to fail closed if `model` is missing.
strict_model_pin = false
hardware_profile = "auto"  # auto, conservative_cpu, balanced, accelerated, lenovo_loq_i5
timeout_seconds = 90
max_tokens = 256
context_tokens = 2048
threads = 2
temperature = 0.2
keep_alive = "5m"  # Keep local model warm in RAM across chat turns for fast responses.
# Connect to Ollama automatically: start the local service when it is not running.
auto_start = true
# Set true to download "model" automatically the first time it is missing.
auto_pull = false

[speech]
# microphone = 0  # Optional sounddevice index; find it with 'hinata devices'.
sample_rate = 16000
language = "en"  # Recognition language: en, hi, fr, or de. Vosk needs a matching model.
stt_backend = "faster-whisper"  # Or "vosk" after configuring a Vosk model directory.
whisper_model = "tiny"
whisper_compute_type = "int8"
# vosk_model_path = 'C:\hinata-models\vosk-model-small-en-us-0.15'
tts_backend = "pyttsx3"  # Offline Windows SAPI, "edge-tts" (neural woman voice when online), or "piper".
tts_voice = ""  # Optional installed voice name/ID substring (blank auto-selects a soft woman voice).
tts_voice_gender = "female"  # "female" (default soft woman voice), "male", or "any".
tts_rate = 165
tts_volume = 0.92
edge_tts_voice = "en-US-AriaNeural"  # Used when tts_backend = "edge-tts".
# piper_executable = 'C:\tools\piper\piper.exe'
# piper_model = 'C:\tools\piper\en_US-lessac-low.onnx'
# piper_config = 'C:\tools\piper\en_US-lessac-low.onnx.json'
speaker_profile = "owner"
speaker_threshold = 0.75

[security]
# Omit allowed_roots to use Desktop, Documents, and Downloads for the current user.
# Relative paths are resolved inside these roots only. Do not add a whole drive casually.
# allowed_roots = ['C:\Users\YOUR_NAME\Desktop', 'C:\Users\YOUR_NAME\Documents']
text_extensions = [".txt", ".md", ".log", ".json", ".csv", ".py", ".js", ".ts", ".tsx", ".jsx", ".html", ".css", ".c", ".cpp", ".h", ".hpp", ".cs", ".java", ".rs", ".go", ".kt", ".swift", ".php", ".rb", ".sql", ".sh", ".ps1", ".yaml", ".yml", ".toml", ".xml", ".dart", ".lua", ".r", ".scala"]
max_read_bytes = 1000000
search_timeout_seconds = 5.0
search_max_directories = 10000
encrypt_at_rest = false  # Envelope writes require .[secure-storage]; this does not encrypt every SQLite column.  # Set true to encrypt sensitive records with a local vault key.
database_encryption_backend = "envelope"  # "envelope", "sqlcipher" (requires .[encrypted-db]), or "auto".
strict_offline = false   # Set true to install process-wide non-loopback socket blocking.
online_mode_enabled = false  # Generic online automation remains opt-in; this does not disable web search.
web_search_enabled = true    # Try public web sources automatically; if offline, fall back to local models/files. strict_offline overrides this.
discover_installed_apps = true  # Discover and open user's installed Windows applications.
allowed_online_domains = []

[agentic]
# Default startup preset: ultra reasoning + low-risk autonomy when no explicit mode is saved.
# Explicit thinking.mode/autonomy_mode entries (including those below) take precedence.
# Set false to disable the preset entirely; approval/PIN gates are always preserved.
ultron_enabled = true
# SUGGEST_ONLY, APPROVAL_EACH_STEP, APPROVED_PLAN, LOW_RISK_AUTONOMY, or OFFLINE_AUTONOMY
autonomy_mode = "APPROVED_PLAN"
max_plan_steps = 12
max_iterations = 8
max_duration_seconds = 180.0
max_model_calls = 10
max_tool_calls = 16
max_replans = 2
per_tool_timeout_seconds = 30.0
max_delegation_depth = 3
max_parallel_readonly = 2

[thinking]
# The deliberation layer that reviews answers and plans before HINATA acts.
# off      = single fast pass (previous behaviour)
# quick    = one self-critique of conversational answers
# balanced = recon -> critique -> revise -> verify -> reflect (base profile without Ultron)
# deep     = balanced plus one bounded second opinion when confidence is low
# ultra    = deep with a mandatory revision pass and the largest budgets
enabled = true
mode = "balanced"
# Cooperative wall-clock deadline and call ceiling. A profile can lower these, never raise them.
max_seconds = 150.0
max_model_calls = 7
# Untrusted evidence handed to the thinking loop, in characters.
memory_budget_chars = 1400
knowledge_budget_chars = 1200
# When true, low-confidence answers say so in the reply text instead of only in metadata.
require_min_confidence = false

[wake_word]
# Disabled to avoid continuous CPU/RAM use. Requires your own trained Hey HINATA ONNX model.
enabled = false
model_path = ""
threshold = 0.5
cooldown_seconds = 2.0

[interface]
dark_theme = true
start_minimized = false
speak_responses = true  # Speak replies to typed and voice requests; can be turned off in Settings.

[memory]
# Conversation messages kept locally; older messages are pruned when a new one is saved.
# Does not change retention of command history, task results, preferences, exports or logs.
conversation_limit = 1000

[personality]
# friend, advisor, technical, strategist, professional, or jarvis. Change at runtime by text or voice.
mode = "friend"
user_name = ""  # Blank uses "Darling"; customize this during installation or in Settings.

# Only these applications can be launched. Commands are fixed arrays, never model-generated.
[applications.notepad]
command = ["notepad.exe"]
process_names = ["notepad.exe"]

[applications.calculator]
command = ["calc.exe"]
process_names = ["Calculator.exe", "calc.exe"]

[applications.explorer]
command = ["explorer.exe"]
process_names = []  # Closing the Windows shell is intentionally disabled.
