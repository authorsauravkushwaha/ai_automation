# HINATA local configuration. setup.ps1 copies this file to config.toml.
# Optional: override the private data directory. Defaults to %LOCALAPPDATA%\HINATA.
# data_dir = 'C:\Users\YOUR_NAME\AppData\Local\HINATA'

[ollama]
enabled = true
host = "http://127.0.0.1:11434"  # Loopback only; remote AI hosts are rejected.
model = "qwen2.5:0.5b-instruct-q4_K_M"  # 494M parameters, Q4_K_M, about 398 MB download.
timeout_seconds = 90
max_tokens = 256
context_tokens = 2048
threads = 2
temperature = 0.2

[speech]
# microphone = 0  # Optional sounddevice index; find it with 'hinata devices'.
sample_rate = 16000
stt_backend = "faster-whisper"  # Or "vosk" after configuring a Vosk model directory.
whisper_model = "tiny"
whisper_compute_type = "int8"
# vosk_model_path = 'C:\hinata-models\vosk-model-small-en-us-0.15'
tts_backend = "pyttsx3"  # Offline Windows SAPI. Or "piper" with paths below.
tts_voice = ""  # Optional installed voice name/ID substring.
tts_rate = 175
# piper_executable = 'C:\tools\piper\piper.exe'
# piper_model = 'C:\tools\piper\en_US-lessac-low.onnx'
# piper_config = 'C:\tools\piper\en_US-lessac-low.onnx.json'
speaker_profile = "owner"
speaker_threshold = 0.75

[security]
# Omit allowed_roots to use Desktop, Documents, and Downloads for the current user.
# Relative paths are resolved inside these roots only. Do not add a whole drive casually.
# allowed_roots = ['C:\Users\YOUR_NAME\Desktop', 'C:\Users\YOUR_NAME\Documents']
text_extensions = [".txt", ".md", ".log", ".json", ".csv", ".py"]
max_read_bytes = 1000000
search_timeout_seconds = 5.0
search_max_directories = 10000

[wake_word]
# Disabled to avoid continuous CPU/RAM use. Requires your own trained Hey HINATA ONNX model.
enabled = false
model_path = ""
threshold = 0.5
cooldown_seconds = 2.0

[interface]
dark_theme = true
start_minimized = false
speak_responses = false

[personality]
# friend, advisor, technical, strategist, or professional. Change at runtime by text or voice.
mode = "friend"

# Only these applications can be launched. Commands are fixed arrays, never model-generated.
[applications.notepad]
command = ["notepad.exe"]
process_names = ["notepad.exe"]

[applications.calculator]
command = ["calc.exe"]
process_names = ["Calculator.exe", "calc.exe"]

[applications.explorer]
command = ["explorer.exe"]
process_names = []  # Closing the Windows shell is intentionally disabled.
