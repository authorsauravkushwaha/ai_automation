name: local-model-validation

on:
  workflow_dispatch:
  push:
    branches: [arena/041b9d6a-ai-automation]
    paths:
      - 'hinata/**'
      - 'scripts/evaluate_ultron_local.py'
      - 'evals/**'
      - '.github/workflows/local-model-validation.yml'

permissions:
  contents: read

concurrency:
  group: local-model-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preloaded-model-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: ${{ runner.temp }}/hinata-validation-models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install core
        run: python -m pip install -e .
      - name: Prepare versioned, checksum-verified Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/ollama eval-results
          curl --fail --location --retry 2 https://github.com/ollama/ollama/releases/download/v0.40.19/ollama-linux-amd64.tar.zst -o .cache/ollama-runtime.tar.zst
          echo '8eb99f9dd91c82f4c51a2c891415bfbdf07bd43f627d82514c47dfd613d2070f  .cache/ollama-runtime.tar.zst' | sha256sum --check -
          tar --zstd -xf .cache/ollama-runtime.tar.zst -C .cache/ollama
          rm .cache/ollama-runtime.tar.zst
          echo "$PWD/.cache/ollama/bin" >> "$GITHUB_PATH"
      - name: Prepare synthetic-evaluation model, then run without auto-downloads
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > eval-results/ollama-service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:11434/api/tags', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Ollama did not become ready')
          PY
          ollama pull qwen2.5:0.5b-instruct-q4_K_M
          ollama list > eval-results/installed-models.txt
          python scripts/evaluate_ultron_local.py --model qwen2.5:0.5b-instruct-q4_K_M --repeat 1 --output eval-results/ultron-local.json
      - name: Retain actual answers, digest identities and timings even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-model-evaluation
          path: eval-results/
          if-no-files-found: error
          retention-days: 14
