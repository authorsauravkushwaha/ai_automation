name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install zero-dependency core
        run: python -m pip install -e .
      - name: Compile and test
        shell: bash
        run: |
          set +e
          python scripts/run_tests.py > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            python scripts/github_test_report.py test-output.txt
            exit "$status"
          fi
      - name: CLI smoke test
        run: python -m hinata --no-llm ask system info
      - name: Validate Windows bootstrap syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'setup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      # Double-clicked from an extracted ZIP, start.bat is decoded by cmd.exe,
      # so it must stay ASCII-only with CRLF line endings.
      - name: Check start.bat encoding and line endings
        shell: bash
        run: |
          if grep -qP '[^\x00-\x7F]' start.bat; then
            echo "start.bat must stay ASCII-only (cmd.exe misreads other encodings)"
            exit 1
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              *$'\r') ;;
              *) echo "start.bat has an LF-only line: $line"; exit 1 ;;
            esac
          done < start.bat
      # pwsh defaults to UTF-8, so the check above cannot see the ANSI decoding
      # that setup.cmd actually gets from Windows PowerShell 5.1.
      - name: Validate Windows bootstrap syntax with Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'setup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  # These tests pin the security boundaries (sandbox containment, secret
  # redaction, offline DNS blocking, audit-chain integrity). They run on their
  # own so a regression fails fast and cannot be lost among 300 other results.
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install zero-dependency core
        run: python -m pip install -e .
      - name: Sandbox, redaction, and audit-boundary regressions
        run: python -m unittest tests.test_weakness_regressions -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install quality tools
        run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff
        run: ruff check hinata tests scripts
      - name: Mypy
        run: mypy hinata
      - name: Build wheel without dependencies
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/hinata-wheel

  desktop-headless-linux:
    # Proves the GUI constructs and behaves under Qt's offscreen platform on a
    # bare Linux runner, using scripts/build_qt_shim.py for the GL/DBus stubs
    # that a minimal image lacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install desktop and light numerical test dependencies
        run: python -m pip install -e ".[gui]" numpy
      - name: Build headless Qt shim
        run: python scripts/build_qt_shim.py --out qt-shim
      - name: Desktop tests under the offscreen platform
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/qt-shim
        run: python scripts/run_tests.py > test-output.txt 2>&1 || (python scripts/github_test_report.py test-output.txt && exit 1)

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install desktop and light numerical test dependencies
        run: python -m pip install -e ".[gui]" numpy
      - name: Test desktop construction without opening a visible window
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python scripts/run_tests.py > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            python scripts/github_test_report.py test-output.txt
            exit "$status"
          fi

  hardening-boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install vetted encryption implementation
        run: python -m pip install -e ".[secure-storage]"
      - name: Exercise networking, crypto migration, processes and verification
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_ultron_hardening tests.test_ultron_remediation tests.test_round2_regressions.VaultKeyCreationTests -v > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            python scripts/github_test_report.py test-output.txt
            exit "$status"
          fi

  guarded-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install browser testing dependencies
        run: python -m pip install -e ".[web-automation]"
      - name: Prepare Chromium (test never downloads at runtime)
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium egress and form acceptance against local fixtures
        env:
          HINATA_REAL_BROWSER_ACCEPTANCE: '1'
        run: python -m unittest tests.test_real_guarded_browser -v
