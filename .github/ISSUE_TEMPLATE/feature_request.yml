name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe your proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Offline, privacy, or safety considerations
      description: Would this require network access, sensitive data, or new permissions?
